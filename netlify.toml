# Configuración de publicación en Netlify (flujo: GitHub -> Netlify).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La aplicación es de una sola página: todas las rutas cargan index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
